# Builds the Windows exe on GitHub's free runners and attaches it to a Release.
# Trigger: push a tag like v1.0.0, or run it by hand from the Actions tab.
name: Build Windows app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build exe
        shell: pwsh
        run: ./app/build.ps1 -OutName YT-Downloader

      - uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader
          path: dist/YT-Downloader.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YT-Downloader.exe
          generate_release_notes: true
